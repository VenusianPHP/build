# Publishes the Linux build environment for amd64 and arm64 to GHCR on every change to build-env/ and on a tag.
name: build-env

on:
  push:
    branches: [main]
    paths: ['build-env/**', '.github/workflows/build-env.yml']
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "hash=$(sha1sum build-env/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: build-env
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/venusianphp/build-env:ubuntu24.04
            ghcr.io/venusianphp/build-env:ubuntu24.04-${{ steps.tag.outputs.hash }}
